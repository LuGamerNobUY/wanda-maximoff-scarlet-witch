<style>
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  display: grid; place-items: center;
  padding: 32px 20px;
  text-align: center;
  color: #f4ebe6;
  font: 400 16px/1.7 "Manrope", system-ui, sans-serif;
  background:
    radial-gradient(60% 50% at 50% 45%, rgba(92, 13, 29, .5), transparent 70%),
    #050203;
  -webkit-font-smoothing: antialiased;
}
main { display: grid; justify-items: center; max-width: 560px; }
svg { width: 96px; height: 96px; fill: none; stroke: #ecd39a; stroke-width: 1.4; stroke-linejoin: round; filter: drop-shadow(0 0 16px rgba(255, 43, 74, .8)); }
.code {
  margin: 26px 0 0;
  font: 600 clamp(72px, 20vw, 150px)/.9 "Cinzel", serif;
  letter-spacing: .06em;
  color: transparent;
  -webkit-text-stroke: 1px rgba(236, 211, 154, .7);
  text-shadow: 0 0 50px rgba(255, 43, 74, .45);
}
h1 { margin: 22px 0 0; font: 500 clamp(24px, 5vw, 36px)/1.15 "Cinzel", serif; text-wrap: balance; }
p { margin: 16px 0 0; font: italic 500 clamp(18px, 3.4vw, 22px)/1.5 "Cormorant Garamond", Georgia, serif; color: rgba(244, 235, 230, .76); text-wrap: pretty; }
a {
  margin-top: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  height: 56px; padding: 0 30px;
  border-radius: 999px;
  border: 1px solid rgba(236, 211, 154, .4);
  background: linear-gradient(135deg, #d61937 0%, #9d1029 55%, #5c0d1d 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 14px 40px -12px rgba(255, 43, 74, .6);
  color: #fff; text-decoration: none;
  font: 700 12px/1 "Manrope", system-ui, sans-serif;
  letter-spacing: .26em; text-transform: uppercase;
  transition: scale 160ms cubic-bezier(.23, 1, .32, 1);
}
a:active { scale: .97; }
a:focus-visible { outline: 2px solid #ecd39a; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" opacity=".5"/>
    <path d="M60 26 L65 50 L79 33 L72.5 56 L87 51 L77 72 L43 72 L33 51 L47.5 56 L41 33 L55 50 Z"/>
    <path d="M60 59 L63.5 63.5 L60 68 L56.5 63.5 Z" stroke="#ff2b4a"/>
  </svg>
  <p class="code" aria-hidden="true">404</p>
  <h1>Esta realidad no existe</h1>
  <p>Quizá fue reescrita por la magia del caos. La página que buscas no está en este universo.</p>
  <a href="./">Volver al inicio</a>
</main>
</body>
